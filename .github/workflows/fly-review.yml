name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy to the preview app
        required: true
        default: main
        type: string

concurrency:
  group: deploy-preview
  # `fly.preview.toml` deploys every PR to the same single shared app (a
  # stable URL for OAuth callback, "only one PR preview at a time"), so the
  # group stays unparameterized on purpose -- two deploys must never run
  # concurrently against it. But cancel-in-progress here means any other
  # PR's push (or a workflow_dispatch) silently cancels whichever deploy was
  # already running, leaving that PR's own run showing "cancelled" with no
  # retry and the shared app not reflecting that PR's code -- confirmed live
  # (run 639, this PR, cancelled by run 640 from an unrelated PR pushed 28s
  # later). Queue instead of cancelling: still only one deploy runs at a
  # time, and the most recent push still ends up live last, but no run gets
  # silently dropped.
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://ainvestor-preview.fly.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1.4

      - name: Create preview app if needed
        run: flyctl apps create ainvestor-preview || true

      - name: Deploy to preview app
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          build_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.event.pull_request.head.ref }}"
          else
            branch="${{ github.event.inputs.ref }}"
          fi
          branch="${branch#refs/heads/}"
          flyctl deploy --remote-only --config fly.preview.toml \
            --build-arg "PREVIEW_GIT_BRANCH=$branch" \
            --build-arg "PREVIEW_BUILD_ISO=$build_iso" \
            --build-arg "PREVIEW_GIT_SHA_SHORT=$short_sha"
